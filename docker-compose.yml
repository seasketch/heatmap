# Use for development purposes.  Building on top of base Dockerfile that is published

services:
  heatmap:
    container_name: heatmap
    image: seasketch/heatmap:workspace
    build:
      context: .
      target: workspace
    volumes:
    # Mount repo, overriding default work space
    - .:/work
    # Mount test project
    - ./projects:/projects
    command: ["bash"]
